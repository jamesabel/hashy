# Lints, type checks and tests the package on every supported Python version, using uv.

name: Python package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Policy: every released version from the minimum supported (3.12, set by msqlite) through the
        # latest stable release (3.15), plus the upcoming pre-release (3.16). Every dependency in uv.lock
        # installs from a wheel on all of them. Move the matrix along as new Pythons are released.
        python-version: ["3.12", "3.13", "3.14", "3.15", "3.16"]

    steps:
    - uses: actions/checkout@v7
    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked

    - name: Lint with ruff
      run: |
        uv run ruff check
        uv run ruff format --check

    - name: Type check with ty
      run: uv run ty check

    - name: Test with pytest
      run: uv run pytest -s --cov --cov-report=xml test_hashy

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage.xml
        flags: ${{ matrix.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
