# Lints, type checks and tests the package on every supported Python version, using uv.

name: Python package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_PREFERENCE: only-system
    strategy:
      fail-fast: false
      matrix:
        # Policy: every released version from the minimum supported (3.12, set by msqlite) through the
        # latest stable release (3.15), plus the upcoming pre-release (3.16). Every dependency in uv.lock
        # installs from a wheel on all of them. Move the matrix along as new Pythons are released.
        python-version: ["3.12", "3.13", "3.14", "3.15", "3.16"]

    steps:
    - uses: actions/checkout@v7
    # The interpreter comes from actions/setup-python, not from uv: the multiprocessing tests need
    # multiprocessing.synchronize, which uv's managed Python lacks on the GitHub runner.
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no floating major tag
      with:
        enable-cache: false  # a handful of small wheels; the cache-save step fails when the cache dir is absent
    - name: Install dependencies
      run: uv sync --locked

    - name: Lint with ruff
      run: |
        uv run ruff check
        uv run ruff format --check

    - name: Type check with ty
      run: uv run ty check

    - name: Test with pytest
      run: uv run pytest -s --cov --cov-report=xml test_hashy

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage.xml
        flags: ${{ matrix.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
